name: Update MonoMarket commit statistics

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Check out MonoMarket history
        uses: actions/checkout@v4
        with:
          repository: myngh04/monomarket
          path: monomarket
          fetch-depth: 0

      - name: Generate commit breakdown
        run: python3 scripts/generate_commit_stats.py --repository monomarket --output assets/commit-stats.svg

      - name: Commit changed chart
        run: |
          if git diff --quiet -- assets/commit-stats.svg; then
            echo "Commit statistics unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-stats.svg
          git commit -m "chore(profile): update MonoMarket commit statistics"
          git push
